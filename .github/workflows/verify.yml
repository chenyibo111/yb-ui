name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-workflow-smoke.mjs
      - run: pnpm verify
      - run: pnpm --filter @chenyibo111/playground test
      - run: pnpm --filter @chenyibo111/docs test
      - run: pnpm build-docs
      - run: pnpm build-storybook

name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify packages, documentation, and Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-workflow-smoke.mjs
      - run: pnpm verify
      - run: pnpm --filter @chenyibo111/playground test
      - name: Verify documentation pages and interactive examples
        run: pnpm --filter @chenyibo111/docs test
      - name: Build documentation site
        run: pnpm build-docs
      - name: Build Storybook
        run: pnpm build-storybook
